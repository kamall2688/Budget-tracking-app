<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Budget Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --paper-dim:#F1EDE3;
    --ink:#1A1816;
    --ink-soft:#5B564E;
    --rule:#D9D2C2;
    --green:#2D5C3E;
    --green-soft:#E4ECE6;
    --rust:#A8462F;
    --rust-soft:#F4E6E1;
    --gold:#C9A86A;
    --shadow: 0 1px 0 rgba(26,24,22,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 2.4em;
    background-position: 0 7.2em;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 24px 120px;
  }

  /* ---------- Header / Hero ---------- */
  header.hero{
    padding:48px 0 28px;
    border-bottom:3px double var(--ink);
    margin-bottom:8px;
  }
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead h1{
    font-family:'Spectral', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.2rem);
    margin:0;
    letter-spacing:-0.01em;
    line-height:1;
  }
  .masthead h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--ink-soft);
  }
  .dateline{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .balance-block{
    margin-top:28px;
    display:flex;
    align-items:flex-end;
    gap:28px;
    flex-wrap:wrap;
  }
  .balance-figure{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:clamp(2.6rem, 8vw, 4.4rem);
    line-height:1;
    font-variant-numeric: tabular-nums;
    letter-spacing:-0.02em;
  }
  .balance-figure.neg{color:var(--rust);}
  .balance-figure.pos{color:var(--green);}
  .balance-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .balance-sub{
    display:flex;
    gap:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.95rem;
    padding-bottom:8px;
  }
  .balance-sub .stat{display:flex; flex-direction:column; gap:2px;}
  .balance-sub .stat .num{font-weight:600; font-variant-numeric: tabular-nums;}
  .balance-sub .stat .lbl{font-family:'Inter',sans-serif; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft);}
  .in-stat .num{color:var(--green);}
  .out-stat .num{color:var(--rust);}

  /* ---------- Sparkline signature ---------- */
  .sparkline-row{
    margin-top:22px;
  }
  .sparkline-row svg{display:block; width:100%; height:64px;}
  .sparkline-row .zeroline{stroke:var(--rule); stroke-width:1; stroke-dasharray:3 4;}
  .sparkline-row .path{
    fill:none;
    stroke:var(--ink);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .sparkline-row .fill{ opacity:0.08; }

  /* ---------- Controls ---------- */
  .toolbar{
    display:flex;
    gap:10px;
    margin:28px 0 18px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
  }
  .filter-group{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    padding:11px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:transform 0.1s ease, box-shadow 0.15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(26,24,22,0.25);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--rule);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn-sm{padding:6px 12px; font-size:0.72rem; border-radius:6px;}

  /* ---------- Entry form (collapsible) ---------- */
  .entry-form{
    background:var(--paper-dim);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:20px;
    margin-bottom:24px;
    display:none;
  }
  .entry-form.open{display:block;}
  .form-grid{
    display:grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
  }
  @media (max-width:760px){
    .form-grid{grid-template-columns:1fr 1fr;}
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:600;
  }
  .field input, .field select{
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    padding:9px 10px;
    border-radius:6px;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .chip:focus-visible, .btn:focus-visible, .type-toggle button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .field input[type="number"]{font-family:'JetBrains Mono', monospace;}

  .type-toggle{
    display:flex;
    border:1px solid var(--rule);
    border-radius:6px;
    overflow:hidden;
  }
  .type-toggle button{
    flex:1;
    border:none;
    background:var(--paper);
    padding:9px 8px;
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .type-toggle button.active.income{background:var(--green-soft); color:var(--green);}
  .type-toggle button.active.expense{background:var(--rust-soft); color:var(--rust);}

  /* ---------- Ledger table ---------- */
  .ledger{
    border-top:2px solid var(--ink);
  }
  .ledger-head{
    display:grid;
    grid-template-columns: 90px 1fr 130px 130px 36px;
    gap:12px;
    padding:10px 4px;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:700;
    border-bottom:1px solid var(--rule);
  }
  .ledger-head .num{text-align:right;}

  .entry-row{
    display:grid;
    grid-template-columns: 90px 1fr 130px 130px 36px;
    gap:12px;
    padding:14px 4px;
    align-items:center;
    border-bottom:1px solid var(--rule);
    animation: rowIn 0.25s ease;
  }
  @keyframes rowIn{
    from{opacity:0; transform:translateY(-4px);}
    to{opacity:1; transform:translateY(0);}
  }
  .entry-date{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .entry-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .entry-desc{font-weight:600; font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-cat{
    font-size:0.72rem;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .entry-cat::before{
    content:'';
    width:6px;height:6px;border-radius:50%;
    background:var(--cat-color, var(--gold));
    display:inline-block;
  }
  .entry-amount{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:0.95rem;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .entry-amount.income{color:var(--green);}
  .entry-amount.expense{color:var(--rust);}
  .entry-running{
    font-family:'JetBrains Mono', monospace;
    font-size:0.85rem;
    text-align:right;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .entry-del{
    background:none; border:none; cursor:pointer;
    color:var(--rule); font-size:1.1rem; line-height:1;
    padding:4px; border-radius:4px;
    transition:color 0.15s ease;
  }
  .entry-del:hover{color:var(--rust);}

  .empty-state{
    padding:64px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:2.4rem; margin-bottom:12px; opacity:0.5; font-family:'Spectral', serif;}
  .empty-state p{margin:4px 0; font-size:0.92rem;}

  /* ---------- Category breakdown ---------- */
  .breakdown{
    margin-top:40px;
    padding-top:28px;
    border-top:1px solid var(--rule);
  }
  .breakdown h2{
    font-family:'Spectral', serif;
    font-size:1.3rem;
    font-weight:600;
    margin:0 0 18px;
  }
  .bar-row{
    display:grid;
    grid-template-columns: 120px 1fr 90px;
    gap:14px;
    align-items:center;
    margin-bottom:10px;
    font-size:0.85rem;
  }
  .bar-cat{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{
    height:10px;
    background:var(--paper-dim);
    border-radius:5px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:5px;
    background:var(--ink);
    transition:width 0.4s ease;
  }
  .bar-amount{
    font-family:'JetBrains Mono', monospace;
    text-align:right;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top:60px;
    padding-top:20px;
    border-top:1px solid var(--rule);
    font-size:0.72rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  footer a{color:var(--ink-soft); text-decoration:underline;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:12px 20px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:all 0.25s ease;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="masthead">
      <h1>Ledger<em>.</em></h1>
      <div class="dateline" id="dateline"></div>
    </div>

    <div class="balance-block">
      <div>
        <div class="balance-label">Current balance</div>
        <div class="balance-figure" id="balanceFigure">$0.00</div>
      </div>
      <div class="balance-sub">
        <div class="stat in-stat">
          <span class="num" id="totalIn">$0.00</span>
          <span class="lbl">In</span>
        </div>
        <div class="stat out-stat">
          <span class="num" id="totalOut">$0.00</span>
          <span class="lbl">Out</span>
        </div>
      </div>
    </div>

    <div class="sparkline-row">
      <svg id="sparkline" viewBox="0 0 800 64" preserveAspectRatio="none"></svg>
    </div>
  </header>

  <div class="toolbar">
    <div class="filter-group" id="filterGroup">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="income">Income</button>
      <button class="chip" data-filter="expense">Expenses</button>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost btn-sm" id="exportBtn">Export CSV</button>
      <button class="btn btn-primary" id="toggleFormBtn">+ Add entry</button>
    </div>
  </div>

  <form class="entry-form" id="entryForm">
    <div class="form-grid">
      <div class="field">
        <label for="descInput">Description</label>
        <input type="text" id="descInput" placeholder="Coffee, paycheck, rent…" required>
      </div>
      <div class="field">
        <label for="amountInput">Amount</label>
        <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0" required>
      </div>
      <div class="field">
        <label for="categoryInput">Category</label>
        <select id="categoryInput">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Shopping</option>
          <option>Income</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" required>
      </div>
      <div class="field">
        <label>Type</label>
        <div class="type-toggle">
          <button type="button" class="active expense" data-type="expense" id="expenseToggle">− Expense</button>
          <button type="button" class="income" data-type="income" id="incomeToggle">+ Income</button>
        </div>
      </div>
    </div>
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button type="submit" class="btn btn-primary">Save entry</button>
      <button type="button" class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
    </div>
  </form>

  <div class="ledger">
    <div class="ledger-head">
      <span>Date</span>
      <span>Description</span>
      <span class="num">Amount</span>
      <span class="num">Balance</span>
      <span></span>
    </div>
    <div id="entryList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="glyph">—</div>
      <p><strong>The ledger is empty.</strong></p>
      <p>Add your first entry above to start tracking.</p>
    </div>
  </div>

  <div class="breakdown" id="breakdownSection" style="display:none;">
    <h2>Spending by category</h2>
    <div id="breakdownBars"></div>
  </div>

  <footer>
    <span>Ledger — a local-first budget tracker. Your data stays in this browser.</span>
    <span><a href="https://github.com" target="_blank" rel="noopener">View on GitHub</a></span>
  </footer>
</div>

<div class="toast" id="toast">Entry added</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "ledger.entries.v1";
  var entries = [];
  var currentFilter = "all";
  var currentType = "expense";

  var CATEGORY_COLORS = {
    "Food": "#A8462F",
    "Transport": "#C9A86A",
    "Housing": "#5B564E",
    "Utilities": "#7A8C6E",
    "Entertainment": "#8E6C9E",
    "Health": "#3E7C8C",
    "Shopping": "#B57A3F",
    "Income": "#2D5C3E",
    "Other": "#A39B8B"
  };

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
    }catch(e){
      entries = [];
    }
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(e){ /* storage unavailable, app still works in-session */ }
  }

  function fmtMoney(n){
    var sign = n < 0 ? "-" : "";
    return sign + "$" + Math.abs(n).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, "$&,");
  }

  function fmtDate(iso){
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "2-digit" });
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function setDefaultDate(){
    var today = new Date();
    var iso = today.toISOString().slice(0,10);
    document.getElementById("dateInput").value = iso;
  }

  function renderDateline(){
    var now = new Date();
    document.getElementById("dateline").textContent = now.toLocaleDateString("en-US", {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
  }

  function getSorted(){
    return entries.slice().sort(function(a,b){
      if (a.date === b.date) return a.createdAt - b.createdAt;
      return a.date < b.date ? -1 : 1;
    });
  }

  function computeRunningBalances(sorted){
    var bal = 0;
    return sorted.map(function(e){
      bal += e.type === "income" ? e.amount : -e.amount;
      return bal;
    });
  }

  function render(){
    var sorted = getSorted();
    var running = computeRunningBalances(sorted);
    var totalIn = 0, totalOut = 0;

    sorted.forEach(function(e){
      if (e.type === "income") totalIn += e.amount;
      else totalOut += e.amount;
    });

    var balance = totalIn - totalOut;

    document.getElementById("balanceFigure").textContent = fmtMoney(balance);
    document.getElementById("balanceFigure").className =
      "balance-figure " + (balance < 0 ? "neg" : "pos");
    document.getElementById("totalIn").textContent = fmtMoney(totalIn);
    document.getElementById("totalOut").textContent = fmtMoney(totalOut);

    renderSparkline(running);
    renderList(sorted, running);
    renderBreakdown(sorted);
  }

  function renderSparkline(running){
    var svg = document.getElementById("sparkline");
    if (running.length < 2){
      svg.innerHTML = '<line x1="0" y1="32" x2="800" y2="32" class="zeroline"></line>';
      return;
    }
    var w = 800, h = 64, pad = 4;
    var min = Math.min.apply(null, running.concat([0]));
    var max = Math.max.apply(null, running.concat([0]));
    var range = (max - min) || 1;

    function x(i){ return pad + (i / (running.length - 1)) * (w - pad*2); }
    function y(v){ return h - pad - ((v - min) / range) * (h - pad*2); }

    var zeroY = y(0);
    var points = running.map(function(v,i){ return x(i) + "," + y(v); });
    var pathD = "M" + points.join(" L");
    var fillD = pathD + " L" + x(running.length-1) + "," + h + " L" + x(0) + "," + h + " Z";

    svg.innerHTML =
      '<line x1="0" y1="' + zeroY + '" x2="800" y2="' + zeroY + '" class="zeroline"></line>' +
      '<path d="' + fillD + '" class="fill" fill="' + (running[running.length-1] >= 0 ? "#2D5C3E" : "#A8462F") + '"></path>' +
      '<path d="' + pathD + '" class="path"></path>';
  }

  function renderList(sorted, running){
    var list = document.getElementById("entryList");
    var empty = document.getElementById("emptyState");

    var filtered = sorted.map(function(e,i){ return {entry:e, bal:running[i]}; })
      .filter(function(item){
        if (currentFilter === "all") return true;
        return item.entry.type === currentFilter;
      })
      .reverse();

    if (filtered.length === 0){
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.innerHTML = filtered.map(function(item){
      var e = item.entry;
      var color = CATEGORY_COLORS[e.category] || "#C9A86A";
      return (
        '<div class="entry-row" data-id="' + e.id + '">' +
          '<div class="entry-date">' + fmtDate(e.date) + '</div>' +
          '<div class="entry-main">' +
            '<span class="entry-desc">' + escapeHtml(e.description) + '</span>' +
            '<span class="entry-cat" style="--cat-color:' + color + '">' + escapeHtml(e.category) + '</span>' +
          '</div>' +
          '<div class="entry-amount ' + e.type + '">' + (e.type === "income" ? "+" : "−") + fmtMoney(e.amount) + '</div>' +
          '<div class="entry-running">' + fmtMoney(item.bal) + '</div>' +
          '<button class="entry-del" data-id="' + e.id + '" title="Delete entry" aria-label="Delete entry">×</button>' +
        '</div>'
      );
    }).join("");
  }

  function renderBreakdown(sorted){
    var section = document.getElementById("breakdownSection");
    var container = document.getElementById("breakdownBars");
    var expenses = sorted.filter(function(e){ return e.type === "expense"; });

    if (expenses.length === 0){
      section.style.display = "none";
      return;
    }
    section.style.display = "block";

    var totals = {};
    expenses.forEach(function(e){
      totals[e.category] = (totals[e.category] || 0) + e.amount;
    });

    var max = Math.max.apply(null, Object.values(totals));
    var rows = Object.keys(totals).sort(function(a,b){ return totals[b]-totals[a]; });

    container.innerHTML = rows.map(function(cat){
      var amt = totals[cat];
      var pct = (amt / max) * 100;
      var color = CATEGORY_COLORS[cat] || "#C9A86A";
      return (
        '<div class="bar-row">' +
          '<span class="bar-cat">' + escapeHtml(cat) + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + color + '"></div></div>' +
          '<span class="bar-amount">' + fmtMoney(amt) + '</span>' +
        '</div>'
      );
    }).join("");
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function showToast(msg){
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
  }

  function exportCSV(){
    if (entries.length === 0){
      showToast("Nothing to export yet");
      return;
    }
    var rows = [["Date","Description","Category","Type","Amount"]];
    getSorted().forEach(function(e){
      rows.push([e.date, e.description, e.category, e.type, e.amount.toFixed(2)]);
    });
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(",");
    }).join("\n");

    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "ledger-export-" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("CSV exported");
  }

  // ---------- Event wiring ----------
  function init(){
    load();
    renderDateline();
    setDefaultDate();
    render();

    var form = document.getElementById("entryForm");
    var toggleFormBtn = document.getElementById("toggleFormBtn");
    var cancelFormBtn = document.getElementById("cancelFormBtn");
    var expenseToggle = document.getElementById("expenseToggle");
    var incomeToggle = document.getElementById("incomeToggle");

    toggleFormBtn.addEventListener("click", function(){
      form.classList.toggle("open");
      if (form.classList.contains("open")){
        document.getElementById("descInput").focus();
      }
    });

    cancelFormBtn.addEventListener("click", function(){
      form.classList.remove("open");
      form.reset();
      setDefaultDate();
    });

    expenseToggle.addEventListener("click", function(){
      currentType = "expense";
      expenseToggle.classList.add("active");
      incomeToggle.classList.remove("active");
    });
    incomeToggle.addEventListener("click", function(){
      currentType = "income";
      incomeToggle.classList.add("active");
      expenseToggle.classList.remove("active");
    });

    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var desc = document.getElementById("descInput").value.trim();
      var amount = parseFloat(document.getElementById("amountInput").value);
      var category = document.getElementById("categoryInput").value;
      var date = document.getElementById("dateInput").value;

      if (!desc || isNaN(amount) || amount <= 0 || !date){
        showToast("Fill in all fields");
        return;
      }

      entries.push({
        id: uid(),
        description: desc,
        amount: Math.round(amount * 100) / 100,
        category: category,
        type: currentType,
        date: date,
        createdAt: Date.now()
      });

      save();
      render();
      form.reset();
      setDefaultDate();
      form.classList.remove("open");
      showToast(currentType === "income" ? "Income added" : "Expense added");
    });

    document.getElementById("entryList").addEventListener("click", function(ev){
      var btn = ev.target.closest(".entry-del");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      entries = entries.filter(function(e){ return e.id !== id; });
      save();
      render();
      showToast("Entry deleted");
    });

    document.getElementById("filterGroup").addEventListener("click", function(ev){
      var chip = ev.target.closest(".chip");
      if (!chip) return;
      currentFilter = chip.getAttribute("data-filter");
      document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
      render();
    });

    document.getElementById("exportBtn").addEventListener("click", exportCSV);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
